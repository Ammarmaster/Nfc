name = "nfc"
compatibility_date = "2024-09-23"
main = "worker.js"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Optional Cloudflare D1 Database Binding (Uncomment and replace with real database_id when created via: npx wrangler d1 create tapreview-db)
# [[d1_databases]]
# binding = "DB"
# database_name = "tapreview-db"
# database_id = "your-real-d1-id"

# Environment variables
[vars]
ENVIRONMENT = "production"
APP_DOMAIN = "https://tapreview.in"
DEFAULT_ROUTE_PREFIX = "/r/"
AI_PROVIDER = "gemini" # Options: gemini, openai, workers-ai, template
AI_MODEL = "gemini-1.5-flash"
ENABLE_NO_KEY_FALLBACK = "true"

# Secret instructions:
# Run: npx wrangler secret put AI_API_KEY
# Run: npx wrangler secret put ADMIN_AUTH_TOKEN
